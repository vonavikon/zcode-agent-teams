name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -q pytest jsonschema
      - name: Configure git for workspace tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Run the test suite
        run: python -m pytest

  schemas:
    name: Schemas, manifests and plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON schemas and manifests
        run: |
          python - <<'PY'
          import json, pathlib, sys
          try:
              import jsonschema
          except ImportError:
              sys.exit("pip install jsonschema")
          for schema in ("schemas/tasks.schema.json",
                         "schemas/verification-report.schema.json"):
              data = json.loads(pathlib.Path(schema).read_text())
              jsonschema.Draft202012Validator.check_schema(data)
              print("schema ok:", schema)
          plugin = json.loads(pathlib.Path(
              "plugins/agent-teams/.zcode-plugin/plugin.json").read_text())
          market = json.loads(pathlib.Path("marketplace.json").read_text())
          assert plugin["version"] == market["plugins"][0]["version"] == "2.0.0"
          print("manifests ok, version", plugin["version"])
          required = [
              "plugins/agent-teams/skills/agent-teams/SKILL.md",
              "plugins/agent-teams/skills/agent-teams/scripts/team.py",
              "plugins/agent-teams/agents/team-executor.md",
              "plugins/agent-teams/agents/team-verifier.md",
              "SPEC.md", "LICENSE",
          ]
          for path in required:
              assert pathlib.Path(path).exists(), path
          print("plugin structure ok:", len(required), "files")
          PY
      - name: Optional zcode plugins validate (non-blocking)
        continue-on-error: true
        run: |
          if ! command -v zcode >/dev/null 2>&1; then
            echo "zcode CLI not installed; skipping validation"
            exit 0
          fi
          zcode plugins validate plugins/agent-teams || true

  min-python:
    name: Minimum Python version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the engine stays 3.10 compatible
        run: |
          python -m pip install -q vermin
          vermin -t=3.10- --no-tips plugins/agent-teams/skills/agent-teams/scripts
