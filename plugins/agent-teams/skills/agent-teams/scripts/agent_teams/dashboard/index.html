<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23007AFF'/%3E%3C/svg%3E">
<title>Моя AI-команда</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="title">
    <b id="teamName">AI-команда</b>
    <span id="teamGoal">загрузка</span>
  </div>
  <span class="pill" id="runState"><span class="dot idle" id="runDot"></span><span id="runStateText">нет данных</span></span>
  <span class="pill muted hidden" id="elapsed"></span>
  <span class="spacer"></span>
  <div class="seg" role="group" aria-label="Режим отображения">
    <button type="button" id="modeSimple" aria-pressed="true">Простой</button>
    <button type="button" id="modeAdvanced" aria-pressed="false">Технический</button>
  </div>
  <button type="button" class="iconbtn" id="themeBtn" aria-label="Переключить тему">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<main>
  <section class="card" aria-labelledby="progressH">
    <div class="core">
      <div class="cardhead"><h2 id="progressH">Общий прогресс</h2><span class="small muted" id="updatedAt"></span></div>
      <div class="progress">
        <div class="ring" role="img" id="ringImg" aria-label="Выполнено 0 процентов">
          <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="52"/><circle class="bar" id="ringBar" cx="60" cy="60" r="52"/></svg>
          <div class="num"><b id="ringPct">0%</b><span>выполнено</span></div>
        </div>
        <div class="story">
          <div class="big" id="storyLine">Загрузка</div>
          <div class="counters" id="counters"></div>
        </div>
      </div>
    </div>
  </section>

  <div class="columns">
    <div class="col" id="colA">
<section class="card" id="nowCard" aria-labelledby="nowH">
      <div class="core">
        <div class="cardhead"><h2 id="nowH">Что происходит сейчас</h2></div>
        <div class="now-list" id="nowList"></div>
      </div>
    </section>
<section class="card" id="planCard" aria-labelledby="planH">
      <div class="core">
        <div class="cardhead"><h2 id="planH">План работы</h2></div>
        <div class="plan" id="planList"></div>
      </div>
    </section>
    </div>
    <div class="col" id="colB">
<section class="card" id="attCard" aria-labelledby="attH">
      <div class="core">
        <div class="cardhead"><h2 id="attH">Нужно ваше внимание</h2><span class="pill" id="attCount">0</span></div>
        <div class="attention-list" id="attList"></div>
      </div>
    </section>
<section class="card" id="feedCard" aria-labelledby="feedH">
      <div class="core">
        <div class="cardhead"><h2 id="feedH">Активность команды</h2><span class="small muted">обновляется автоматически</span></div>
        <div class="feed" id="feed"></div>
      </div>
    </section>
    </div>
  </div>
</main>

<noscript><p>Для работы доски нужен включённый JavaScript.</p></noscript>
<div class="conn" id="conn" role="status"></div>

<script src="/static/app.js"></script>
</body>
</html>
